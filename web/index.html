<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico?v=20260914-transparent"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png?v=20260914-transparent"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title><%= splashSiteName || 'New API' %></title>
    <meta name="title" content="<%= splashSiteName || 'New API' %>" />
    <meta
      name="description"
      content="ZeroCat gives creators and teams a singular gateway to leading AI models, with the control and flexibility to build what comes next."
    />

    <!-- Social preview metadata. Keep the title build-time branded so the
         same image can be used by branded deployments without changing the
         shared HTML template. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZeroCat" />
    <meta property="og:title" content="<%= splashSiteName || 'ZeroCat' %>" />
    <meta
      property="og:description"
      content="ZeroCat gives creators and teams a singular gateway to leading AI models, with the control and flexibility to build what comes next."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="<%= splashSiteName || 'ZeroCat' %>" />
    <meta
      name="twitter:description"
      content="ZeroCat gives creators and teams a singular gateway to leading AI models, with the control and flexibility to build what comes next."
    />
    <meta name="twitter:image" content="/logo.png" />

    <meta
      name="theme-color"
      content="#faf9f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#141413"
      media="(prefers-color-scheme: dark)"
    />
    <!--umami-->
    <!--Google Analytics-->

    <!-- Resolve the persisted theme before first paint so dark-mode users
         never flash a light frame. The cookie name is injected at build time
         from src/lib/theme-cookie.ts, the same constant the theme provider
         uses when it re-applies the resolved theme after React mounts. -->
    <script>
      try {
        var appThemeMatch = document.cookie.match(
          /(?:^|;\s*)<%= themeCookieName %>=(dark|light|system)/
        )
        var appTheme = appThemeMatch ? appThemeMatch[1] : 'system'
        if (
          appTheme === 'dark' ||
          (appTheme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>

    <link
      rel="preload"
      href="/fonts/manrope-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- First-paint loader: covers the gap from HTML load until the router
         is idle (root beforeLoad, mount, first route chunk). The wordmark
         reveals letter by letter — a staggered rise out of a slight blur —
         then idles on a soft pulse. Removal choreography lives in
         routes/__root.tsx.
         Manrope is self-hosted (not @fontsource) so this pre-bundle surface
         and the app share one font file; index.css must not re-import it. -->
    <style>
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope-latin-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope-latin-ext-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Non-Latin subsets served by the locale switcher (ru/vi UI languages,
         Greek symbols). Same fontsource ranges; the browser only downloads a
         subset when the page actually renders characters from its range. */
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope-cyrillic-wght-normal.woff2')
          format('woff2-variations');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope-cyrillic-ext-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F,
          U+FE2E-FE2F;
      }
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope-greek-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1,
          U+03A3-03FF;
      }
      @font-face {
        font-family: 'Manrope Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/manrope-vietnamese-wght-normal.woff2')
          format('woff2-variations');
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1,
          U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329,
          U+1EA0-1EF9, U+20AB;
      }
      html.dark {
        background-color: #141413;
        color-scheme: dark;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        background: #faf9f5;
        /* Deferred reveal: stay invisible for the first 150ms so instant
           (cached) loads never flash a splash. RootComponent keeps a splash
           that did appear on screen until the wordmark finishes drawing,
           then fades it out via .app-loading-leave (see routes/__root.tsx). */
        opacity: 0;
        animation: app-loading-appear 0.3s ease-out 0.15s forwards;
      }
      html.dark #app-loading {
        background: #141413;
      }
      #app-loading.app-loading-leave {
        animation: app-loading-vanish 0.24s ease-out forwards;
      }
      @keyframes app-loading-appear {
        to {
          opacity: 1;
        }
      }
      @keyframes app-loading-vanish {
        to {
          opacity: 0;
        }
      }
      /* Wordmark reveal: each letter rises out of a slight blur in sequence
         (same motion family as the member card's stamp-press), then the
         assembled mark idles on a soft pulse. Solid glyphs read cleanly for
         names full of round letters, unlike an outline trace. */
      #app-loading .brand {
        max-width: 100%;
        text-align: center;
        font-family:
          'Manrope Variable',
          'Inter Variable',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: clamp(40px, 7.5vw, 68px);
        font-weight: 800;
        letter-spacing: 0.04em;
        color: #ff8a3d;
        animation: app-loading-pulse 2.4s ease-in-out 1.4s infinite;
      }
      html.dark #app-loading .brand {
        color: #ff8a3d;
      }
      #app-loading .brand span {
        display: inline-block;
        opacity: 0;
        transform: translateY(14px);
        filter: blur(6px);
        animation: app-loading-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes app-loading-rise {
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes app-loading-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.02);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading {
          animation: none;
          opacity: 1;
        }
        #app-loading .brand {
          animation: none;
        }
        #app-loading .brand span {
          animation: none;
          opacity: 1;
          transform: none;
          filter: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
    <div id="app-loading" aria-hidden="true">
      <div class="brand"></div>
    </div>
    <script>
      // Brand the splash. The build-time name (PUBLIC_SITE_NAME, injected as
      // a ready-made JS string literal so quotes/angle brackets in the value
      // cannot break this script) wins so a branded build shows its own
      // wordmark immediately; deployments built without it fall back to the
      // backend name cached from /api/status, then the page title. One span
      // per code point (Array.from keeps surrogate pairs such as emoji
      // intact) drives the staggered rise; the 150ms base delay matches the
      // overlay's deferred reveal, and routes/__root.tsx mirrors this timing
      // when deciding how long to hold the splash.
      try {
        var appLoadingName = JSON.parse(
          localStorage.getItem('status') || '{}'
        ).system_name
      } catch (e) {}
      var appLoadingBrand =
        <%= splashSiteNameJs %> || appLoadingName || document.title
      var appLoadingWrap = document.querySelector('#app-loading .brand')
      Array.from(appLoadingBrand).forEach(function (char, index) {
        var span = document.createElement('span')
        span.textContent = char === ' ' ? ' ' : char
        span.style.animationDelay = 150 + index * 40 + 'ms'
        appLoadingWrap.appendChild(span)
      })
      // Failsafe: routes/__root.tsx removes the splash once the router is
      // idle, but that code only runs after React mounts. If a pre-mount
      // await hangs (auth bootstrap, setup check, a stalled chunk), nothing
      // else can retire the overlay - so fade it out here unconditionally.
      setTimeout(function () {
        var appLoadingStuck = document.getElementById('app-loading')
        if (!appLoadingStuck) return
        appLoadingStuck.classList.add('app-loading-leave')
        setTimeout(function () {
          appLoadingStuck.remove()
        }, 240)
      }, 10000)
    </script>
  </body>
</html>
